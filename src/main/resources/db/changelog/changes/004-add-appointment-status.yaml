databaseChangeLog:
  - changeSet:
      id: 004-add-appointment-status
      author: Czupson
      comment: "Add status to appointments"
      changes:
        - addColumn:
            tableName: appointments
            columns:
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: AVAILABLE
                  constraints:
                    nullable: false